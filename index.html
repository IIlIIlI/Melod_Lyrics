<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MELOD 가사</title><style>body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif}.box{max-width:700px;margin:auto;padding:25px 16px}.logo{text-align:center;font-size:30px;font-weight:bold;margin:20px}.sub{text-align:center;color:#999;margin-bottom:25px}.search{display:flex;gap:8px}input{flex:1;padding:15px;border-radius:12px;border:1px solid #333;background:#1b1d21;color:white;font-size:16px}button{padding:0 18px;border:0;border-radius:12px;background:#5865f2;color:white;font-weight:bold}.status{text-align:center;color:#aaa;margin:20px}.song{display:none;background:#1b1d21;border-radius:16px;padding:18px}.title{font-size:22px;font-weight:bold}.artist{color:#aaa;margin-top:6px}.lyrics{white-space:pre-wrap;line-height:1.9;margin-top:25px;font-size:17px}.error{text-align:center;color:#ff7777;margin:20px}.sync-line{font-size:clamp(23px,5vw,36px);font-weight:700;line-height:1.5;color:#555;opacity:.65;padding:12px 0;transition:color .4s,opacity .4s,transform .4s}
.sync-line.active{color:#fff;opacity:1;transform:scale(1.03)}
.lyrics:has(.sync-line){padding:35vh 0 45vh}
html{scroll-behavior:smooth}
</style></head><body><div class="box"><div class="logo">🎵 MELOD</div><div class="sub">LRCLIB 가사 검색</div><div class="search"><input id="q" placeholder="곡 제목 또는 가수 입력"><button onclick="searchLyrics()">가사 검색</button></div><div id="status" class="status"></div><div id="error" class="error"></div><div id="song" class="song"><div id="title" class="title"></div><div id="artist" class="artist"></div><div id="lyrics" class="lyrics"></div></div></div><script>async function searchLyrics(){const q=document.getElementById("q").value.trim();const status=document.getElementById("status");const error=document.getElementById("error");const song=document.getElementById("song");if(!q){error.textContent="곡 제목이나 가수를 입력해주세요.";return}error.textContent="";song.style.display="none";status.textContent="🔍 가사를 검색하는 중...";try{const r=await fetch("https://lrclib.net/api/search?q="+encodeURIComponent(q));if(!r.ok)throw Error();const a=await r.json();if(!a.length){status.textContent="";error.textContent="❌ 가사를 찾을 수 없습니다.";return}const t=a[0];document.getElementById("title").textContent=t.trackName||"제목 없음";document.getElementById("artist").textContent=t.artistName||"가수 정보 없음";const lyricsBox=document.getElementById("lyrics");
if(t.syncedLyrics){
  const lines=t.syncedLyrics.split("\n").map(line=>{
    const m=line.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
    return m?{time:Number(m[1])*60+Number(m[2]),text:m[3].trim()}:null;
  }).filter(Boolean);
  if(lines.length){
    lyricsBox.innerHTML="";
    lines.forEach(line=>{
      const div=document.createElement("div");
      div.className="sync-line";
      div.textContent=line.text||"♪";
      lyricsBox.appendChild(div);
    });
    const started=Date.now();
    let previousActive=-1;
    function updateLyrics(){
      if(!lyricsBox.isConnected)return;
      const seconds=(Date.now()-started)/1000;
      let active=0;
      lines.forEach((line,i)=>{if(seconds>=line.time)active=i;});
      const elements=lyricsBox.querySelectorAll(".sync-line");
      elements.forEach((el,i)=>el.classList.toggle("active",i===active));
      if(active!==previousActive){
        elements[active]?.scrollIntoView({behavior:"smooth",block:"center"});
        previousActive=active;
      }
      requestAnimationFrame(updateLyrics);
    }
    requestAnimationFrame(updateLyrics);
  }else{
    lyricsBox.textContent=t.plainLyrics||"가사가 없습니다.";
  }
}else{
  lyricsBox.textContent=t.plainLyrics||"가사가 없습니다.";
}status.textContent="";song.style.display="block"}catch(e){status.textContent="";error.textContent="❌ 가사를 불러오지 못했습니다."}}const p=new URLSearchParams(location.search);const q=[p.get("artist"),p.get("title")].filter(Boolean).join(" ");if(q){document.getElementById("q").value=q;searchLyrics();}</script></body></html>
